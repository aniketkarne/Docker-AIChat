services:
  backend:
    build:
      context: ./backend
    container_name: docker-aichat-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-side URL of the backend. Must be reachable from the user's
        # browser: 'backend' is a compose-internal hostname and does not
        # resolve outside the compose network. The backend port is published
        # to the host, so localhost works in the default setup. Inlined at
        # build time (NEXT_PUBLIC_ prefix), hence a build arg.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: docker-aichat-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
